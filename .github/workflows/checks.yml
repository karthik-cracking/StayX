name: Check source tools
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q scripts
      - name: Check public source boundaries
        run: |
          python - <<'PY'
          import pathlib
          bad={'.apk','.apkm','.p12','.jks','.keystore','.idsig'}
          files=[p for p in pathlib.Path('.').rglob('*') if p.is_file() and '.git' not in p.parts]
          assert not [str(p) for p in files if p.suffix.lower() in bad]
          PY
