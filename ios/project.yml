name: StayX
options:
  bundleIdPrefix: com.stayx
  deploymentTarget:
    iOS: "17.0"
packages:
  SmartTubeIOS:
    path: vendor/SmartTubeIOS
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGNING_ALLOWED: NO
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  StayX:
    type: application
    platform: iOS
    sources: [App]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: StayX
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSPhotoLibraryAddUsageDescription: StayX saves the videos you download to your Photos library.
        NSLocalNetworkUsageDescription: StayX discovers AirPlay devices on your local network.
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        CFBundleURLTypes:
          - CFBundleURLName: com.stayx.ios
            CFBundleURLSchemes: [stayx, smarttube]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stayx.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) ENABLE_DOWNLOADS"
    dependencies:
      - package: SmartTubeIOS
        product: SmartTubeIOS
      - package: SmartTubeIOS
        product: SmartTubeIOSCore
  StayXSmokeTests:
    type: bundle.ui-testing
    platform: iOS
    sources: [SmokeTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.stayx.ios.smoketests
    dependencies:
      - target: StayX
schemes:
  StayX:
    build:
      targets:
        StayX: all
        StayXSmokeTests: [test]
    test:
      targets: [StayXSmokeTests]
